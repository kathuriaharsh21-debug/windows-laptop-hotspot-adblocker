<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e4e6f0;
       width: 320px; padding: 16px; margin: 0; }
h2 { font-size: .95rem; font-weight: 700; margin-bottom: 12px;
     background: linear-gradient(135deg, #6c63ff, #a78bfa);
     -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.row { display: flex; justify-content: space-between; align-items: center;
       padding: 8px 12px; background: #14161f; border-radius: 8px; margin-bottom: 8px;
       border: 1px solid #1e2130; }
.label { font-size: .78rem; color: #9ca3af; }
.val { font-size: .85rem; font-weight: 600; }
.green { color: #22d3a4; } .red { color: #ff4d6a; }
a { display: block; text-align: center; margin-top: 14px;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    color: #fff; text-decoration: none; padding: 10px;
    border-radius: 10px; font-size: .82rem; font-weight: 600; }
</style>
</head>
<body>
<h2>🛡 HotspotShield Active</h2>
<div class="row">
  <span class="label">Status</span>
  <span class="val green">Blocking Active</span>
</div>
<div class="row">
  <span class="label">YouTube Scriptlets</span>
  <span class="val green">Injected</span>
</div>
<div class="row">
  <span class="label">CSS Cosmetic Filters</span>
  <span class="val green">Active</span>
</div>
<div class="row">
  <span class="label">Network Rules</span>
  <span class="val green">30,000 domains</span>
</div>
<a href="http://localhost:3000" target="_blank">Open Full Dashboard →</a>
</body>
</html>
