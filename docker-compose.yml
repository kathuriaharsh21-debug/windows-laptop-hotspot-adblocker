version: '3.8'

services:
  # Layer 1 Core Sinkhole Engine
  dns-engine:
    image: adguard/adguardhome:v0.107.43
    container_name: win-hotspot-dns-engine
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - ./dns/adguardhome/work:/opt/adguardhome/work
      - ./dns/adguardhome/conf:/opt/adguardhome/conf
      - ./blocklists:/opt/adguardhome/blocklists

  # Layer 4 SNI SSAI Filter & Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: win-hotspot-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production

  # Glassmorphism Web Dashboard
  frontend-dashboard:
    build:
      context: ./frontend
    container_name: win-hotspot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
